server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${LANGFUSE_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${LANGFUSE_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Langfuse OTLP 基址，例如 https://cloud.langfuse.com/api/public/otel
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
          headers:
            Authorization: ${LANGFUSE_OTLP_AUTHORIZATION:}
            x-langfuse-ingestion-version: "4"

file:
  upload:
    allowed-extensions: txt,md,markdown,pdf,doc,docx,ppt,pptx,xlsx,png,jpg,jpeg,webp

mineru:
  enabled: ${MINERU_ENABLED:false}
  base-url: ${MINERU_BASE_URL:https://mineru.net}
  language: ch
  enable-table: true
  ocr: false
  enable-formula: true
  connect-timeout: 5s
  read-timeout: 30s
  poll-interval: 2s
  max-poll-duration: 300s

# MinIO 对象存储：文档原文的唯一存储位置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:superbiz}
  secret-key: ${MINIO_SECRET_KEY:superbiz}
  bucket: ${MINIO_BUCKET:superbiz-documents}

retrieval:
  vector-top-n: 20
  bm25-top-n: 20
  candidate-top-n: 20
  rrf-k: 60
  embedding-dim: 1024
  min-score: 0
  reranker:
    type: none

# 火山方舟（豆包）模型配置
volcengine:
  api-key: ${VOLCENGINE_API_KEY:${ARK_API_KEY:your-api-key-here}}
  chat:
    base-url: ${VOLCENGINE_CHAT_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
    timeout-ms: 180000
  embedding:
    base-url: ${VOLCENGINE_EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
    path: ${VOLCENGINE_EMBEDDING_PATH:/embeddings/multimodal}
    model: ${VOLCENGINE_EMBEDDING_MODEL:doubao-embedding-vision}
    dimensions: ${VOLCENGINE_EMBEDDING_DIMENSIONS:1024}
    input-style: ${VOLCENGINE_EMBEDDING_INPUT_STYLE:multimodal}

# Spring AI Alibaba DashScope 配置（保留 starter 兼容，主链路已切换至 volcengine）
spring:
  application:
    name: devops-agent
  autoconfigure:
    exclude:
      # 只把 Trace 送到 Langfuse，不把 Micrometer 指标推到本地 4318。
      - org.springframework.boot.micrometer.metrics.autoconfigure.export.otlp.OtlpMetricsExportAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/superbiz
    username: superbiz
    password: superbiz
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
  ai:
    chat:
      observations:
        # 默认不把 prompt / completion 送进 Trace。eval profile 再打开。
        log-prompt: false
        log-completion: false
        include-error-logging: true
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 未配置有效 MCP 地址时请保持 enabled: false，否则启动时会阻塞连接占位 URL。
    # 日志查询由本地 queryLogs 访问 Loki，不依赖 MCP。
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# 知识库检索条数
rag:
  top-k: 3

# 文档分片配置
document:
  chunk:
    target-tokens: 450
    max-tokens: 600
    overlap-tokens: 60

# 问答 Agent 上下文管理
context:
  # 模型总上下文预算；会从中预留输出、系统提示和工具定义空间。
  max-context-tokens: 24000
  reserved-output-tokens: 4000
  system-and-tools-reserve-tokens: 6000
  summary-tokens: 2000
  recent-message-tokens: 8000
  compression-trigger-tokens: 8000

# Langfuse 只接收 Trace。密钥通过环境变量注入，不写进仓库。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  environment: ${LANGFUSE_ENVIRONMENT:dev}
  app-version: ${APP_VERSION:unknown}
  include-tool-content: false

# 观测后端。Agent 只调用诊断工具，不直接暴露 PromQL / LogQL。
observability:
  prometheus:
    base-url: http://localhost:9090
    timeout: 10s
  loki:
    base-url: http://localhost:3100
    timeout: 10s
    default-limit: 20
    max-limit: 100
    max-message-chars: 500

# 统一业务 Agent 配置
agent:
  model: ${AGENT_MODEL:DeepSeek-V4.1-Flash}
  chat:
    temperature: 0.7
    max-tokens: 2000
    top-p: 0.9
  budget:
    max-model-calls: 12
    max-tool-calls: 20
    max-calls-per-tool: 6
    max-duration-seconds: 240
    max-tool-result-chars: 6000
    max-consecutive-tool-failures: 2
    max-evidence-chars: 4000
  thinking:
    enabled: true
    type: enabled
