server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    allowed-extensions: txt,md

# MinIO 对象存储：文档原文的唯一存储位置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:superbiz}
  secret-key: ${MINIO_SECRET_KEY:superbiz}
  bucket: ${MINIO_BUCKET:superbiz-documents}

retrieval:
  vector-top-n: 10
  bm25-top-n: 10
  rrf-k: 60
  embedding-dim: 1024

# 火山方舟（豆包）模型配置
volcengine:
  api-key: ${VOLCENGINE_API_KEY:${ARK_API_KEY:your-api-key-here}}
  chat:
    base-url: https://ark.cn-beijing.volces.com/api/coding/v3
    completions-path: /chat/completions
    timeout-ms: 180000
  embedding:
    base-url: https://ark.cn-beijing.volces.com/api/coding/v3
    path: /embeddings/multimodal
    model: doubao-embedding-vision
    dimensions: 1024

# Spring AI Alibaba DashScope 配置（保留 starter 兼容，主链路已切换至 volcengine）
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/superbiz
    username: superbiz
    password: superbiz
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 未配置有效 MCP 地址时请保持 enabled: false，否则启动时会阻塞连接占位 URL。
    # Mock 日志（cls.mock-enabled=true）与真实 MCP 不要同时作为日志来源。
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置（旧版 RagService 仍引用；主索引链路已切换至 volcengine）
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4

# RAG 配置
rag:
  top-k: 3
  model: "doubao-seed-2.1-turbo"

# 文档分片配置
document:
  chunk:
    max-size: 800
    overlap: 100

# 问答 Agent 上下文管理
context:
  # 模型总上下文预算；会从中预留输出、系统提示和工具定义空间。
  max-context-tokens: 24000
  reserved-output-tokens: 4000
  system-and-tools-reserve-tokens: 6000
  summary-tokens: 2000
  recent-message-tokens: 8000
  compression-trigger-tokens: 8000

# Agent 运行轨迹：每个会话一个 append-only JSONL 文件。
trajectory:
  enabled: true
  base-dir: ${TRAJECTORY_DIR:./data/trajectories}
  max-content-chars: 100000
  # 开启后每个事件都会 fsync，审计更强但写入延迟更高。
  force-on-write: false

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 本地开发默认 Mock 日志工具；真实日志需启用 spring.ai.mcp.client 并配置有效 MCP

# 统一业务 Agent 配置
agent:
  model: "doubao-seed-2.1-turbo"
  chat:
    temperature: 0.7
    max-tokens: 2000
    top-p: 0.9
  budget:
    max-model-calls: 12
    max-tool-calls: 20
    max-duration-seconds: 240
    max-tool-result-chars: 6000
    max-consecutive-tool-failures: 2
    max-evidence-chars: 4000
  thinking:
    enabled: true
    type: enabled
