services:
  postgres:
    container_name: superbiz-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: superbiz
      POSTGRES_USER: superbiz
      POSTGRES_PASSWORD: superbiz
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbiz -d superbiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    container_name: superbiz-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: superbiz
      MINIO_ROOT_PASSWORD: superbiz
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
